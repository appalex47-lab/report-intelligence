name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas unitarias (las que necesitan plantillas reales se omiten)
        run: python -m pytest tests/unit -q
      - name: Regresión contra la línea base (motor y hallazgos; la capa del PPTX se omite sin plantillas)
        run: python -m pytest tests/regression -q
