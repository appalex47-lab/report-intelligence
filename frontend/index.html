<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Intelligence</title>
<style>
:root{
  --bg:#F2F5F9;--surface:#fff;--surface-2:#F7F9FC;--ink:#152036;--muted:#586379;--line:#DCE2EC;--line-2:#C9D1DF;
  --primary:#0A62B5;--primary-ink:#fff;--primary-soft:#E4F0FB;--ok:#1C7A4B;--ok-soft:#E1F3E9;--warn:#9A5B00;--warn-soft:#FFF1D6;
  --bad:#B3261E;--bad-soft:#FBE4E2;--k-hecho:#2F5E8E;--k-hecho-soft:#E6EEF7;--k-int:#6A4BA3;--k-int-soft:#EEE8F7;
  --k-rec:#B4511A;--k-rec-soft:#FCEBDD;--k-ctx:#0E7C80;--k-ctx-soft:#DDF3F3;--k-info:#6B7280;--k-info-soft:#EDEFF3;
  --shadow:0 1px 2px rgba(16,28,52,.06),0 4px 16px rgba(16,28,52,.06);
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1422;--surface:#151E31;--surface-2:#1A2539;--ink:#E7ECF5;--muted:#9AA6BD;--line:#26324A;--line-2:#33425F;
  --primary:#5AA6F0;--primary-ink:#06223F;--primary-soft:#14304F;--ok:#5FD39A;--ok-soft:#123525;--warn:#F2B552;--warn-soft:#3A2B0E;
  --bad:#FF8F86;--bad-soft:#3F1B19;--k-hecho:#8DB8E8;--k-hecho-soft:#182B44;--k-int:#B9A2EA;--k-int-soft:#2A2145;
  --k-rec:#FFA877;--k-rec-soft:#3A2417;--k-ctx:#63D1D5;--k-ctx-soft:#0F3436;--k-info:#A7B0C0;--k-info-soft:#212B3F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px 0 48px;display:grid;gap:14px}
header.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-end;flex-wrap:wrap}
h1{font-size:22px;margin:0;font-weight:650}
.sub{color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--primary)}
.steps{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.step{flex:1 1 150px;display:flex;gap:8px;align-items:center;padding:10px 14px;border:0;border-right:1px solid var(--line);background:none;cursor:pointer;color:var(--muted);text-align:left}
.step:last-child{border-right:0}
.step i{font-style:normal;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);font-size:12px;font-weight:600;flex:none}
.step.done i{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.step.bad i{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.step.now{color:var(--ink);font-weight:600;background:var(--primary-soft)}
.step.now i{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.step[disabled]{opacity:.5;cursor:not-allowed}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);display:inline-block}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed;pointer-events:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
label.f{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select,textarea{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%}
.drop{border:2px dashed var(--line-2);border-radius:12px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2)}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:10px;padding:12px 14px;border:1px solid}
.banner .sub{display:block}
.banner.bad{background:var(--bad-soft);border-color:var(--bad)}.banner.ok{background:var(--ok-soft);border-color:var(--ok)}.banner.warn{background:var(--warn-soft);border-color:var(--warn)}
.find{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:8px 0;border-top:1px solid var(--line)}
.sev{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:99px;height:fit-content}
.sev.block{background:var(--bad-soft);color:var(--bad)}.sev.warn{background:var(--warn-soft);color:var(--warn)}.sev.info{background:var(--k-info-soft);color:var(--k-info)}
code{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.st{font-weight:700}.st.cumple{color:var(--ok)}.st.cerca{color:var(--warn)}.st.debajo{color:var(--bad)}
.work{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:14px;align-items:start}
@media(max-width:900px){.work{grid-template-columns:1fr}}
.rail{padding:8px;display:grid;gap:2px;position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto}
.ritem{display:flex;gap:8px;align-items:center;border:0;background:none;border-radius:8px;padding:8px;cursor:pointer;text-align:left;width:100%}
.ritem:hover{background:var(--surface-2)}.ritem[aria-current=true]{background:var(--primary-soft);font-weight:600}
.ritem .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}.ritem .dot.warn{background:var(--warn)}.ritem .dot.edit{background:var(--primary)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.chip.hecho{background:var(--k-hecho-soft);color:var(--k-hecho)}.chip.interpretacion{background:var(--k-int-soft);color:var(--k-int)}
.chip.recomendacion{background:var(--k-rec-soft);color:var(--k-rec)}.chip.contexto{background:var(--k-ctx-soft);color:var(--k-ctx)}.chip.info_insuficiente{background:var(--k-info-soft);color:var(--k-info)}
.para{border:1px solid var(--line);border-left:4px solid var(--kc,var(--line-2));border-radius:10px;background:var(--surface-2);padding:10px 12px;display:grid;gap:8px}
.para[data-k=hecho]{--kc:var(--k-hecho)}.para[data-k=interpretacion]{--kc:var(--k-int)}.para[data-k=recomendacion]{--kc:var(--k-rec)}.para[data-k=contexto]{--kc:var(--k-ctx)}
.para textarea{resize:none;overflow:hidden;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.warnline{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px}
.okline{font-size:12px;color:var(--ok)}
.mini{border:0;background:none;color:var(--primary);cursor:pointer;font-size:12px;padding:2px 4px}
.mini:hover{text-decoration:underline}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.thumbs img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:zoom-in}
.kv{display:flex;justify-content:space-between;gap:10px}
.trend{display:grid;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
svg.spark{width:100%;height:42px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:9}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;z-index:10;padding:16px}.dlg img{max-width:100%;max-height:100%}
[hidden]{display:none!important}
.boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:20;padding:16px}.boot .card{max-width:460px;display:grid;gap:8px}

/* indicadores de avance */
.topbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:30;overflow:hidden;background:transparent}
.topbar::before{content:"";position:absolute;inset:0;width:40%;background:var(--primary);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.loader{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--ink);
  border:1px solid var(--line-2);border-radius:99px;padding:10px 16px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.spin{width:16px;height:16px;border:2px solid var(--line-2);border-top-color:var(--primary);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
body.busy .btn,body.busy .step,body.busy .tab,body.busy .ritem,body.busy .drop{pointer-events:none;opacity:.6}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
/* paneles plegables */
details.rail>summary,details.insp>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600;padding:8px}
details.rail>summary::-webkit-details-marker,details.insp>summary::-webkit-details-marker{display:none}
details>summary .chev{transition:transform .15s;color:var(--muted)}details[open]>summary .chev{transform:rotate(180deg)}
@media(max-width:900px){.rail{position:static!important;max-height:none!important}}
.aibox{border:1px dashed var(--line-2);border-radius:10px;padding:8px 12px;background:var(--surface-2)}
.aibox>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:8px;align-items:center}.aibox>summary::-webkit-details-marker{display:none}
.chip.ia{background:var(--primary-soft);color:var(--primary)}
.plan{border:1px solid var(--line-2);border-radius:10px;padding:10px;display:grid;gap:8px;background:var(--surface)}
.plan pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.4 var(--sans);max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface-2)}
</style>
</head>
<body>
<div id="boot" class="boot"><div class="card"><strong>Report Intelligence</strong><div class="sub" id="boot-msg">Iniciando el motor en tu navegador…</div>
  <div class="sub">Todo se procesa en tu equipo: los archivos no se envían a ningún servidor.</div></div></div>
<div class="wrap">
  <header class="top">
    <div><h1>Report Intelligence</h1><div class="sub">Excel → reporte ejecutivo verificado · el motor calcula, la narrativa se revisa, la presentación sale de la plantilla</div></div>
    <button class="btn" id="newRun">Nuevo reporte</button>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="rep">Reporte</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="hist">Historial y tendencias</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="tpl">Plantillas</button>
  </div>

  <section id="p-rep" class="grid">
    <div class="steps" id="steps"></div>
    <div id="view"></div>
  </section>

  <section id="p-hist" class="grid" hidden></section>
  <section id="p-tpl" class="grid" hidden></section>
</div>
<div id="toast" class="toast" hidden></div>
<div id="topbar" class="topbar" hidden></div>
<div id="loader" class="loader" role="status" aria-live="polite" hidden><span class="spin"></span><span id="loader-msg"></span><span id="loader-t" class="sub"></span></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const STEPS = ["Cargar", "Validar", "Metas y contexto", "Revisar narrativa", "Generar"];
const KIND = {hecho:"Hecho", interpretacion:"Interpretación", recomendacion:"Recomendación", contexto:"Contexto del equipo", info_insuficiente:"Información insuficiente"};
const fmtM = v => v == null ? "—" : Math.abs(v) >= 1e6 ? `$${(v/1e6).toFixed(2)} M` : `$${Math.round(v).toLocaleString("es-MX")}`;
const fmtP = v => v == null ? "—" : `${v>=0?"+":""}${(v*100).toFixed(1)} %`;

const S = {disc:null, discSeen:[], discOpen:false, aiOpen:false, ai:{}, info:{render:false}, tpls:[], run:null, step:0, analysis:null, narr:null, edits:{}, sec:0, result:null, busy:false, err:null};
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3500)}
/* ---------------------------------------------------------------- motor en el navegador (Pyodide en un Web Worker) */
const PYQ = new URLSearchParams(location.search).get("py");
const worker = new Worker("worker.js" + (PYQ ? "?py=" + encodeURIComponent(PYQ) : ""));
const pending = new Map(); let seq = 0, engineReady = false;
worker.onmessage = (e) => {
  const m = e.data;
  if (m.progress) { const o = $("#boot-msg"); if (o) o.textContent = m.progress; return; }
  const p = pending.get(m.id); if (!p) return; pending.delete(m.id);
  if (m.ok) { engineReady = true; const o = $("#boot"); if (o) o.hidden = true; p.res(m); }
  else p.rej(new Error(m.error || `Error ${m.status}`));
};
worker.onerror = (e) => { const o = $("#boot-msg"); if (o) o.textContent = "No se pudo iniciar el motor: " + (e.message || "error") + ". Recarga la página."; };
function ask(msg, transfer = []) { return new Promise((res, rej) => { const id = ++seq; pending.set(id, { res, rej }); worker.postMessage({ id, ...msg }, transfer); }); }
/* ---------------------------------------------------------------- indicador de avance (barra superior + mensaje con segundos) */
const LOADER_LABELS = [[/\/file$/, "Leyendo y validando el libro de Excel…"], [/\/analysis$/, "Validando los datos…"], [/\/narrative$/, "Calculando la narrativa…"],
  [/\/generate$/, "Generando la presentación…"], [/\/ia\/check$/, "Verificando la redacción…"], [/\/ia\/facts$/, "Preparando los hechos…"], [/\/ia\/discovery\/check$/, "Verificando el descubrimiento…"], [/\/discovery$/, "Guardando el descubrimiento…"], [/\/(targets|context)$/, "Guardando…"], [/^\/templates\/.+/, "Guardando la plantilla…"],
  [/^\/history\//, "Cargando el historial…"], [/^\/machote/, "Preparando el machote…"], [/\/files\//, "Preparando la descarga…"], [/^\/templates$/, null]];
let loaderN = 0, loaderT0 = 0, loaderTimer = null;
function loaderStart(label){
  loaderN++; $("#loader-msg").textContent = label;
  if(loaderN === 1){
    loaderT0 = Date.now(); $("#loader").hidden = false; $("#topbar").hidden = false; document.body.classList.add("busy");
    loaderTimer = setInterval(() => { const s = Math.round((Date.now() - loaderT0) / 1000); $("#loader-t").textContent = s >= 3 ? s + " s" : ""; }, 500);
  }
}
function loaderEnd(){
  loaderN = Math.max(0, loaderN - 1);
  if(!loaderN){ clearInterval(loaderTimer); $("#loader").hidden = true; $("#topbar").hidden = true; $("#loader-t").textContent = ""; document.body.classList.remove("busy"); }
}
const labelFor = path => { for(const [rx, l] of LOADER_LABELS) if(rx.test(path)) return l; return null; };
async function api(path, opts = {}){
  const label = labelFor(path.split("?")[0]);
  if(!label) return apiRaw(path, opts);
  loaderStart(label);
  try{ return await apiRaw(path, opts) } finally { loaderEnd() }
}
async function apiRaw(path, opts = {}){
  const method = (opts.method || "GET").toUpperCase();
  let body = null, file = null, p = "/api" + path;
  const q = p.indexOf("?");
  if (q >= 0) { body = Object.fromEntries(new URLSearchParams(p.slice(q + 1))); p = p.slice(0, q); }
  if (opts.body instanceof FormData) { const f = opts.body.get("file"); file = { name: f.name, buffer: await f.arrayBuffer() }; }
  else if (opts.body) body = JSON.parse(opts.body);
  const r = await ask({ method, path: p, body, file }, file ? [file.buffer] : []);
  return r.json;
}
async function fetchFile(path, query = null){            // descarga: el archivo sale del sistema de archivos virtual del motor
  const label = labelFor(path);
  if(label) loaderStart(label);
  try{ const r = await ask({ method: "GET", path: "/api" + path, body: query }); return r.file }
  finally { if(label) loaderEnd() }
}
async function download(path, query = null){
  try{
    const f = await fetchFile(path, query);
    if(!f || !f.buffer) throw new Error("No se recibió el archivo del motor.");
    const name = (f.name && String(f.name).replace(/[\\/]/g, "_")) || "reporte.pptx";
    const bytes = f.buffer instanceof ArrayBuffer ? new Uint8Array(f.buffer) : new Uint8Array(f.buffer);
    if(name.toLowerCase().endsWith(".pptx") && (bytes.length < 4 || bytes[0] !== 0x50 || bytes[1] !== 0x4b)){
      throw new Error("El archivo no es un PPTX válido (no empieza como ZIP). Revisa plantilla y generación.");
    }
    const mime = name.toLowerCase().endsWith(".pdf")
      ? "application/pdf"
      : name.toLowerCase().endsWith(".pptx")
        ? "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        : "application/octet-stream";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([bytes], { type: mime }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }catch(e){ toast(e.message || String(e)) }
}
/* ---------------------------------------------------------------- redacción con IA (Cohere) · la llamada sale del navegador con la clave del usuario */
const AI_KEY = "ri.ai.key", AI_MODEL = "ri.ai.model", AI_DEFAULT = "command-a-03-2025";
const aiKey = () => { try{ return sessionStorage.getItem(AI_KEY) || localStorage.getItem(AI_KEY) || "" }catch{ return "" } };
const aiRemembered = () => { try{ return !!localStorage.getItem(AI_KEY) }catch{ return false } };
const aiModel = () => { try{ return localStorage.getItem(AI_MODEL) || AI_DEFAULT }catch{ return AI_DEFAULT } };
function aiSave(key, model, remember){
  try{ sessionStorage.setItem(AI_KEY, key); if(remember) localStorage.setItem(AI_KEY, key); else localStorage.removeItem(AI_KEY); localStorage.setItem(AI_MODEL, model) }catch{ /* sin almacenamiento */ }
}
const AI_STYLES = {
  directo: "Ejecutivo cercano: directo y claro, con criterio; como un buen analista que le explica a su director en una junta de cinco minutos.",
  conversacional: "Conversacional profesional: cálido y natural, como si lo estuvieras platicando en una reunión, sin perder el rigor ni caer en lo informal.",
  narrativo: "Narrativo: cuenta lo que pasó como una historia corta con hilo (qué había, qué cambió, qué queda), sin adornos ni dramatismo."
};
const aiStyle = () => { try{ return localStorage.getItem("ri.ai.style") || "directo" }catch{ return "directo" } };
const aiSystem = (style) => `Eres un analista senior que escribe para la dirección de una empresa farmacéutica de e-commerce. Reescribes párrafos YA VERIFICADOS para que suenen a una persona que domina el tema, no a un reporte automático.
Estilo: ${AI_STYLES[style] || AI_STYLES.directo}
Para que suene humano: varía cómo empieza cada frase; usa conectores naturales (en cambio, aun así, mientras tanto, lo que deja, de hecho); prefiere verbos concretos a sustantivos abstractos; alterna frases cortas y medianas; evita muletillas de reporte ("se observa", "cabe destacar", "es importante mencionar", "en el periodo analizado", "a nivel de"); sin anglicismos innecesarios; puedes reordenar las ideas, unir o separar frases.
Reglas inviolables:
1. Conserva TODAS las cifras, porcentajes, montos y periodos exactamente como están (mismo formato: $12.22 M, +56%, 2025). No agregues ninguna cifra nueva ni quites ninguna.
2. No agregues datos, nombres ni explicaciones de causa. No uses "debido a", "porque", "gracias a", "por falta de", "se debe", "a raíz de".
3. Misma idea y longitud similar o menor.
4. Conserva viñetas ("• "), numeración ("1. [ALTA]") y saltos de línea; si el párrafo inicia con un título corto, déjalo igual.
Responde SOLO un JSON {"parrafos": [...]} con el mismo número de elementos y en el mismo orden.`;
async function cohereRewrite(texts, key, model, style = "directo"){
  let r;
  try{
    r = await fetch("https://api.cohere.com/v2/chat", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model, temperature: 0.6, response_format: { type: "json_object" },
        messages: [{ role: "system", content: aiSystem(style) }, { role: "user", content: JSON.stringify({ parrafos: texts }) }] }) });
  }catch{ throw new Error("No se pudo conectar con Cohere desde el navegador (revisa tu red; algunas redes corporativas bloquean la conexión).") }
  if(!r.ok){
    const t = await r.text().catch(() => "");
    throw new Error(r.status === 401 || r.status === 403 ? "Cohere rechazó la clave: revisa que sea válida." : r.status === 429 ? "Cohere pidió esperar (límite de uso de la clave). Intenta de nuevo en un minuto."

  }
  const j = await r.json();
  const txt = (j.message && j.message.content || []).map(c => c.text || "").join("");
  let arr; try{ arr = JSON.parse(txt).parrafos }catch{ throw new Error("La respuesta de Cohere no vino en el formato esperado.") }

function aiCandidates(sec){
  const texts = curTexts(sec), vis = sec.parrafos.filter(p => p.visible), wasEdited = edited(sec.clave);

    const kind = wasEdited ? "hecho" : (vis[i] && vis[i].tipo);
    if(["hecho", "interpretacion", "recomendacion"].includes(kind) && /\d/.test(t) && t.trim().length > 25) idx.push(i);     // el contexto del equipo nunca se envía
  });

async function aiRun(plans, key, model){
  aiSave(key, model, $("#aiRemember").checked); try{ localStorage.setItem("ri.ai.style", $("#aiStyle").value) }catch{}

      const verdict = await api(`/runs/${S.run.id}/ia/check`, J("POST", { model, items: idx.map((i, n) => ({ original: texts[i], rewritten: arr[n] })) }));

}
/* ---------------------------------------------------------------- descubrimiento único (IA propone, el usuario valida) */
const DISC_SEC = { datos: ["Lo que dicen los datos", "hecho"], significado: ["Lo que significa", "interpretacion"], hipotesis: ["Hipótesis a validar", "contexto"], accion: ["Qué haríamos", "recomendacion"] };
const discSystem = (avoid) => `Eres un analista senior de e-commerce farmacéutico. Recibes una HOJA DE HECHOS ya verificados (cada hecho tiene id, tema, texto y "nuevo"). Tu trabajo es escribir UNA hoja de análisis completa —del tamaño de una diapositiva— con un descubrimiento propio de este reporte.
Lo más importante: la presentación YA muestra panorama, canales, líneas, categorías, productos, negados, conclusiones y recomendaciones. Los hechos con "nuevo": false son justo lo que ya está en esas diapositivas: úsalos solo como contexto y NO los repitas. Construye el hallazgo sobre los hechos con "nuevo": true (cruces, productividad, mezcla, pacientes, geografía, calendario, tendencias…), que no aparecen en ninguna otra diapositiva.
Estructura FIJA (se repite cada mes), con estas secciones:
- "titular": una frase de máximo 230 caracteres con el hallazgo central (apoyada en hechos nuevos).
- viñetas con "seccion": "datos" (3 o 4: lo que dicen los datos nuevos), "significado" (2 o 3: qué significa el patrón, sin causas externas), "hipotesis" (1 o 2: posibles explicaciones a comprobar, con cautela, cada una con "validar" = qué dato o área la confirmaría o descartaría), "accion" (2 o 3: qué haríamos, empezando con un verbo: Revisar, Priorizar, Comparar, Vigilar…).
Reglas inviolables:
1. Usa únicamente cifras que aparezcan en los hechos que cites, tal como están escritas. No calcules, no redondees, no inventes.
2. Cada viñeta y el titular citan los ids de los hechos en que se apoyan (campo "hechos"). Las viñetas de datos, significado e hipótesis deben citar al menos un hecho con "nuevo": true.
3. Nunca afirmes causas (no uses "debido a", "porque", "gracias a", "se debe", "por culpa de", "a raíz de").
4. Título corto (máximo 60 caracteres, sin cifras) que nombre el hallazgo, no el tema.
5. Cada viñeta: máximo 280 caracteres, español natural y directo, como lo contaría una persona que conoce el negocio; evita muletillas de reporte. Se puede repetir la estructura de un mes a otro, pero el contenido debe salir de los datos de este.${avoid.length ? "\n6. Ya se propusieron estos ángulos; propón uno distinto: " + avoid.map(a => "«" + a + "»").join(", ") + "." : ""}
Responde SOLO un JSON: {"titulo": "...", "angulo": "...", "titular": {"texto": "...", "hechos": ["ID"]}, "viñetas": [{"seccion": "datos|significado|hipotesis|accion", "texto": "...", "hechos": ["ID"], "validar": ""}]}`;
async function cohereDiscovery(facts, key, model, avoid){
  let r;
  try{
    r = await fetch("https://api.cohere.com/v2/chat", { method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model, temperature: 0.8, response_format: { type: "json_object" },
        messages: [{ role: "system", content: discSystem(avoid) }, { role: "user", content: JSON.stringify({ hechos: facts.map(f => ({ id: f.id, tema: f.tema, nuevo: !!f.nuevo, texto: f.texto })) }) }] }) });
  }catch{ throw new Error("No se pudo conectar con Cohere desde el navegador (revisa tu red; algunas redes corporativas bloquean la conexión).") }
  if(!r.ok){
    const t = await r.text().catch(() => "");
    throw new Error(r.status === 401 || r.status === 403 ? "Cohere rechazó la clave: revisa que sea válida." : r.status === 429 ? "Cohere pidió esperar (límite de uso de la clave). Intenta de nuevo en un minuto."
      : r.status === 404 ? "Cohere no reconoce ese modelo: revisa el nombre del modelo." : `Cohere respondió ${r.status}. ${t.slice(0, 140)}`);
  }
  const j = await r.json();
  const txt = (j.message && j.message.content || []).map(c => c.text || "").join("");
  try{ return JSON.parse(txt) }catch{ throw new Error("La respuesta de Cohere no vino en el formato esperado.") }
}

function stepState(){
  const a = S.analysis, r = S.run;
  const blocks = a ? a.findings.filter(f=>f.severity==="block") : [];
  const targetsOnly = a && blocks.length && blocks.every(f=>f.id==="TARGETS_MISSING");
  return [
    {done:!!(r && r.filename), ok:!!r},
    {done:!!a && !blocks.length, bad:!!a && blocks.some(f=>f.id!=="TARGETS_MISSING"), ok:!!(r && r.filename)},
    {done:!!a && !!a.can_generate, bad:targetsOnly, ok:!!a},
    {done:!!S.narr, ok:!!(a && a.can_generate && a.generator_available)},
    {done:!!S.result, bad:S.result && !S.result.qa_passed, ok:!!(a && a.can_generate && a.generator_available)},
  ];
}

function vValidate(box){

/* ---------------------------------------------------------------- historial */
function spark(points){
  if(points.length < 2) return "";
  const vs = points.map(p=>p.valor), lo = Math.min(...vs), hi = Math.max(...vs), w = 300, h = 40;
  const xy = points.map((p,i)=>[4 + i*(w-8)/(points.length-1), h-4-((p.valor-lo)/((hi-lo)||1))*(h-8)]);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="Serie histórica"><polyline fill="none" stroke="var(--primary)" stroke-width="2" points="${xy.map(p=>p.join(",")).join(" ")}"/>${xy.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--primary)"/>`).join("")}</svg>`;
}
function trendsHtml(ts){
  if(!ts || !ts.length) return `<div class="sub">Aún no hay historial para este formato.</div>`;
  return ts.map(t=>`<div class="trend"><div class="row"><b>${esc({monto:"Venta",pacientes:"Pacientes",ticket:"Ticket"}[t.metrica]||t.metrica)}</b><span class="chip ${t.tipo||"info_insuficiente"}">${esc(t.tendencia)}</span></div>
    <div>${esc(t.texto||"Información insuficiente: se necesitan al menos 3 periodos consecutivos.")}</div>${spark(t.puntos||[])}
    <div class="sub">${(t.puntos||[]).map(p=>esc(p.periodo)+(p.fuente==="derivado"?"*":"")).join(" · ")}</div></div>`).join("");
}

  try{
    const list = await api("/templates"); S.tpls = list;
    host.innerHTML = `<div class="card grid"><strong>Plantillas PPTX</strong>
      <div class="sub">Son los PPTX originales (con logos y formato). No se publican en GitHub: cárgalas una vez y quedan guardadas en este navegador. Si el repositorio es privado, también puedes publicarlas en <code>templates/&lt;formato&gt;/1/template.pptx</code>.</div>
      ${list.map(t=>`<div class="row"><div><b>${esc(t.label)}</b> <span class="sev ${t.available?"info":"block"}">${t.available?"CARGADA":"FALTA"}</span></div>
        <label class="btn">${t.available?"Reemplazar":"Cargar"} .pptx<input type="file" accept=".pptx" data-k="${esc(t.key)}" hidden></label></div>`).join("")}</div>`;
    host.querySelectorAll("input[data-k]").forEach(i=>i.onchange=async()=>{ const f=i.files[0]; if(!f) return;
      const fd=new FormData(); fd.append("file", f);
      try{ await api("/templates/"+i.dataset.k, {method:"POST", body:fd}); toast("Plantilla guardada"); renderTpl() }catch(e){ toast(e.message) } });
  }catch(e){ host.innerHTML = `<div class="banner bad">${esc(e.message)}</div>` }
}

/* ---------------------------------------------------------------- arranque */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
  $("#p-rep").hidden = t.dataset.tab!=="rep"; $("#p-hist").hidden = t.dataset.tab!=="hist"; $("#p-tpl").hidden = t.dataset.tab!=="tpl";
  if(t.dataset.tab==="hist") renderHist();
  if(t.dataset.tab==="tpl") renderTpl();
  if(t.dataset.tab==="rep" && S.run && S.run.filename) go(S.step);              // al volver (p. ej. tras cargar una plantilla) se refresca el estado
});
$("#newRun").onclick = () => { S.run=null; S.analysis=null; S.narr=null; S.result=null; S.step=0; S.err=null; store.set("ri.run",""); render() };
(async () => {
  try{ S.info = await api("/info"); S.tpls = await api("/templates") }catch(e){ const m=$("#boot-msg"); if(m) m.textContent = "No se pudo iniciar el motor: " + e.message; return }
  const id = store.get("ri.run");
  if(id){ try{ S.run = await api(`/runs/${id}`); if(S.run.filename){ S.step = 1; await refreshAnalysis(); if(S.run.generated) S.result = await api(`/runs/${id}/result`).catch(()=>null) } }catch{ S.run = null; S.step = 0 } }
  render();
})();
</script>
</body>
</html>
