<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Sustitución de fuentes SOLO para el render (PDF y revisión visual).
     El PPTX conserva "Aptos Narrow"; aquí se reemplaza por una fuente de métrica cercana
     que sí está disponible (Carlito = métricas de Calibri). Ver docs/ARQUITECTURA.md §9.5. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test qual="any" name="family"><string>Aptos Narrow</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Aptos</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Carlito</string></edit>
  </match>
</fontconfig>
